# Server port
server.port=${PORT:8081}

# Database Connection (using Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/military_asset_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional: show SQL statements for debugging
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:military-asset-mgmt-super-secret-key-2024-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Demo Data
demo.data.enabled=${DEMO_DATA_ENABLED:true}
